name: Fix ContentView key path

on:
  push:
    branches:
      - v1.4b-premium-goals

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4b-premium-goals
          fetch-depth: 0

      - name: Fix malformed Product key path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Youthful/ContentView.swift')
          s = p.read_text()
          old = r'@Query(sort: \\Product.name)'
          new = r'@Query(sort: \Product.name)'
          if old not in s:
              raise SystemExit('Expected malformed Product key path was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Youthful/ContentView.swift
          git commit -m 'Fix Product key path in ContentView'
          git rm .github/workflows/fix-contentview-keypath.yml
          git commit -m 'Remove temporary key path fix workflow'
          git push origin HEAD:v1.4b-premium-goals
