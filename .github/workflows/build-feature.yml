name: Build Youthful Glow - Feature Branch

on:
  push:
    branches:
      - feature/routine-streaks
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/routine-streaks

      - name: Fix feature-branch Swift key path typo
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Youthful/ContentView.swift')
          s = p.read_text()
          old = '@Query(sort: \\\\Product.name)'
          new = '@Query(sort: \\Product.name)'
          if old not in s:
              raise SystemExit('Expected SmartRoutineCard Query line was not found')
          p.write_text(s.replace(old, new, 1))
          print('Fixed SmartRoutineCard @Query key path')
          PY
          grep -n 'SmartRoutineCard\|@Query(sort:' Youthful/ContentView.swift | head -10

      - name: Build unsigned iOS app
        run: |
          set -e
          xcodebuild -project Youthful.xcodeproj -scheme Youthful -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          rm -rf Payload Youthful-feature.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Youthful-feature.ipa Payload

      - name: Upload feature IPA
        uses: actions/upload-artifact@v4
        with:
          name: Youthful-feature-routine-streaks
          path: Youthful-feature.ipa
          if-no-files-found: error
          retention-days: 14
