name: Build Youthful IPA

on:
  push:
    branches:
      - feature/routine-streaks
  workflow_dispatch:

# Keep only the newest build for this branch. If another build starts while
# one is already running, cancel the older run instead of producing duplicates.
concurrency:
  group: youthful-glow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned app
        run: |
          set -e
          xcodebuild -project Youthful.xcodeproj -scheme Youthful -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Youthful.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Youthful-unsigned-ipa
          path: Youthful.ipa
